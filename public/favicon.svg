       comb turns to mush. -->
  <path d="M8 1h16l8 15-8 15H8L0 16z" fill="#e8a63d"/>
  <path d="M12.4 7.8h7.2l3.6 8.2-3.6 8.2h-7.2L8.8 16z" fill="#16130f"/>
</svg>
